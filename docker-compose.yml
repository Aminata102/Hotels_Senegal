version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotels_senegal_api
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - hotels-network

  webserver:
    image: nginx:alpine
    container_name: hotels_senegal_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hotels-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: hotels_db
    restart: always
    environment:
      MYSQL_DATABASE: hotels_db
      MYSQL_USER: hotels_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - hotels-network

networks:
  hotels-network:
    driver: bridge

volumes:
  dbdata: